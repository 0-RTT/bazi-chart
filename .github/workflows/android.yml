name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-engine:
    name: 算法校验（Python）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 基础表校验
        run: python tools/verify/verify_tables.py

      - name: 分析层校验
        run: python tools/verify/verify_analysis.py

      - name: 真太阳时校验
        run: python tools/verify/verify_truesolar.py

      - name: 滚轮取值公式校验
        run: python tools/verify/verify_wheel.py

      - name: 历史存储格式校验
        run: python tools/verify/verify_history.py

  build:
    name: 构建 Debug APK
    runs-on: ubuntu-latest
    needs: verify-engine
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest 镜像已预装 Android SDK（ANDROID_HOME=/usr/local/lib/android/sdk）。
      # 刻意不使用 android-actions/setup-android@v3：它末尾会执行 `sdkmanager tools`，
      # 而 tools 包已从 SDK 仓库移除，在新镜像上必然报
      # "Failed to find package 'tools'" 并失败。
      - name: 安装 SDK 组件
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "已安装平台: $(ls "$ANDROID_HOME/platforms" | tr '\n' ' ')"
          echo "已安装构建工具: $(ls "$ANDROID_HOME/build-tools" | tr '\n' ' ')"

      # 仓库未提交 gradle-wrapper.jar（二进制不便离线生成），
      # 故 CI 直接使用 setup-gradle 提供的 Gradle 8.7 发行版。
      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # 兜底：万一 setup-gradle 未把 gradle 放进 PATH，直接下载发行版。
      - name: 确认 Gradle 可用
        run: |
          if command -v gradle >/dev/null 2>&1; then
            gradle --version
          else
            curl -sSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"
            echo "$HOME/gradle-dist/gradle-8.7/bin" >> "$GITHUB_PATH"
            "$HOME/gradle-dist/gradle-8.7/bin/gradle" --version
          fi

      - name: 引擎回归测试
        run: gradle :core:calendar:test :core:bazi:test :core:interpret:test --no-daemon --stacktrace

      - name: 构建 Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: bazi-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 失败时上传报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
