name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-engine:
    name: 算法校验（Python）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 基础表校验
        run: python tools/verify/verify_tables.py

      - name: 分析层校验
        run: python tools/verify/verify_analysis.py

      - name: 真太阳时校验
        run: python tools/verify/verify_truesolar.py

  build:
    name: 构建 Debug APK
    runs-on: ubuntu-latest
    needs: verify-engine
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 SDK 组件
        run: sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # 仓库未提交 gradle-wrapper.jar（二进制不便离线生成），
      # 故 CI 直接使用 setup-gradle 提供的 Gradle 8.7 发行版。
      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: 引擎回归测试
        run: gradle :core:bazi:test --no-daemon --stacktrace

      - name: 构建 Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: bazi-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 失败时上传报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
